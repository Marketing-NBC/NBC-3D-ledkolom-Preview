<title>NBC Events · 3D Kolom Preview</title>

<style>
  :root{
    --navy:#0E1C2B;
    --navy-deep:#070F18;
    --navy-surface:#16293A;
    --gold:#C7A24A;
    --gold-bright:#E3C277;
    --cream:#F5F1EA;
    --font:'Poppins',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  }
  html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);
    background:radial-gradient(circle at 50% 36%, #1A3047 0%, #0E1C2B 46%, var(--navy-deep) 100%);}
  #c{display:block;width:100%;height:100%;touch-action:none;}

  /* subtiel podium-vignet voor diepte */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 38%, rgba(4,9,15,.55) 100%);}

  /* NBC logo, subtiel linksboven */
  #logo{position:fixed;top:22px;left:24px;z-index:4;width:96px;height:auto;opacity:.85;
    filter:drop-shadow(0 2px 8px rgba(0,0,0,.4));}
  #logo svg{width:100%;height:auto;display:block;}

  /* knoppen rechtsboven */
  #btns{position:fixed;top:20px;right:20px;display:flex;gap:10px;z-index:4;}
  #btns button{background:rgba(22,41,58,.72);color:var(--cream);
    border:1px solid rgba(199,162,74,.45);border-radius:999px;
    padding:10px 18px;font-family:var(--font);font-size:13px;font-weight:500;
    letter-spacing:.2px;cursor:pointer;backdrop-filter:blur(6px);transition:.18s;}
  #btns button:hover{border-color:var(--gold);color:#fff;background:rgba(22,41,58,.95);}

  /* hint onderaan */
  #hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;z-index:3;
    color:var(--cream);opacity:.7;font-size:13px;font-weight:400;letter-spacing:.4px;pointer-events:none;}
  #hint::before{content:"";display:block;width:46px;height:2px;margin:0 auto 12px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9;}

  /* start-overlay */
  #start{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;cursor:pointer;
    background:radial-gradient(circle at 50% 40%, #16293A 0%, #0E1C2B 55%, var(--navy-deep) 100%);}
  #start .projname{display:__NAME_DISPLAY__;color:var(--gold-bright);font-size:22px;font-weight:600;
    letter-spacing:.5px;text-align:center;max-width:80vw;margin-bottom:-6px;}
  #start .play{display:flex;align-items:center;gap:14px;
    background:var(--navy-surface);border:1.5px solid var(--gold);border-radius:999px;
    padding:16px 30px;color:var(--cream);font-size:18px;font-weight:600;letter-spacing:.3px;
    box-shadow:0 10px 40px rgba(0,0,0,.45);transition:.2s;}
  #start:hover .play{background:#1d3850;box-shadow:0 12px 48px rgba(199,162,74,.22);}
  #start .play .tri{color:var(--gold-bright);font-size:20px;line-height:1;}
  #start small{color:var(--cream);opacity:.55;font-size:13px;font-weight:400;letter-spacing:.4px;}
  #start .brand{position:fixed;bottom:26px;color:var(--cream);opacity:.4;font-size:12px;letter-spacing:1px;}
</style>
</head>
<body>

  <button id="spin">Auto-draaien: aan</button>
</div>

<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="hint">Sleep om te draaien · scroll om te zoomen</div>

<div id="start">
  <div class="projname">__PROJECT_NAME__</div>
  <div class="play"><span class="tri">&#9654;</span><span>Bekijk de 3D-kolom</span></div>
  <small>daarna slepen om rond te draaien</small>
  <div class="brand">NBC EVENTS · RUIMTE VOOR MAGIE</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const W = 1, D = 1, H = __FACE_RATIO__;
const canvas  = document.getElementById('c');
const startEl = document.getElementById('start');

// ---- 1. event listeners EERST — vóór alle code die kan crashen ---
let _webglReady = false, video;

function begin(){
  if (!_webglReady) {
    startEl.innerHTML =
      '<div class="projname" style="display:block;margin-bottom:8px">3D-preview</div>' +
      '<div class="play" style="cursor:default;flex-direction:column;gap:6px">' +
        '<span>Open in Safari of Chrome</span>' +
      '</div>' +
      '<small style="margin-top:12px">Deze app ondersteunt geen 3D-weergave</small>' +
      '<div class="brand">NBC EVENTS \xb7 RUIMTE VOOR MAGIE</div>';
    return;
  }
  startEl.style.display = 'none';
  video.play().catch(()=>{});
}
startEl.addEventListener('click', begin);
startEl.addEventListener('touchend', (e) => { e.preventDefault(); begin(); });

// ---- 2. Three.js initialiseren in try/catch ----------------------
let renderer, scene, camera, orbit, column;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
  camera.position.set(3.2, 0.5, 8);

  orbit = new OrbitControls(camera, renderer.domElement);
  orbit.enableDamping = true;
  orbit.target.set(0, 0, 0);
  orbit.minDistance = 3;
  orbit.maxDistance = 25;

  // ---- video als textuur (los bestand, streamt) ------------------
  video = document.createElement('video');
  video.src = 'kolom.mp4';
  video.loop = true;
  video.muted = true;
  video.playsInline = true;
  video.preload = 'auto';
  video.setAttribute('playsinline','');
  video.setAttribute('webkit-playsinline','');

  const tex = new THREE.VideoTexture(video);
  tex.colorSpace = THREE.SRGBColorSpace;

  // ---- box met per-zijde een kwart van de textuur ----------------
  const geo = new THREE.BoxGeometry(W, H, D);
  const uv  = geo.attributes.uv;
  function strip(faceIndex, uMin, uMax){
    const o = faceIndex * 4;
    for (let k = 0; k < 4; k++){
      const u = uv.getX(o + k);
      uv.setX(o + k, uMin + u * (uMax - uMin));
    }
  }
  strip(4, 0.00, 0.25);  // +Z  zijde 1
  strip(0, 0.25, 0.50);  // +X  zijde 2
  strip(5, 0.50, 0.75);  // -Z  zijde 3
  strip(1, 0.75, 1.00);  // -X  zijde 4
  uv.needsUpdate = true;

  const sideMat = new THREE.MeshBasicMaterial({ map: tex });
  const capMat  = new THREE.MeshBasicMaterial({ color: 0x0c1722 });
  column = new THREE.Mesh(geo, [sideMat, sideMat, capMat, capMat, sideMat, sideMat]);
  scene.add(column);

  column.add(new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color: 0xC7A24A, transparent:true, opacity:0.28 })
  ));

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(2.4, 48),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent:true, opacity:0.30 })
  );
  floor.rotation.x = -Math.PI/2;
  floor.position.y  = -H/2 - 0.02;
  scene.add(floor);

  _webglReady = true;   // alles gelukt

} catch(e) {
  console.warn('WebGL niet beschikbaar:', e.message);
  // begin() toont de foutmelding bij de eerste tik
}

// ---- 3. Renderloop en UI alleen als WebGL werkt ------------------
if (_webglReady) {
  let spin = true;
  const spinBtn = document.getElementById('spin');
  spinBtn.onclick = () => { spin = !spin; spinBtn.textContent = 'Auto-draaien: ' + (spin?'aan':'uit'); };
  orbit.addEventListener('start', () => { spin = false; spinBtn.textContent = 'Auto-draaien: uit'; });

  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h; camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();

  function loop(){
    requestAnimationFrame(loop);
    if (spin) column.rotation.y += 0.005;
    orbit.update();
    renderer.render(scene, camera);
  }
  loop();
}
</script>
