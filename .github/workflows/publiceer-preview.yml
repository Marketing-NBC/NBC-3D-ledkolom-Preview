name: Preview bouwen en publiceren

# Zet de site online. Draait na "Release verwerken" (via workflow_run, want
# dat gebeurt altijd op de standaardbranch en dus mag deze job wel naar Pages
# publiceren), als er iets in docs/ verandert, en handmatig via "Run workflow".
#
# De designaanvraag-tool start hem ook (via "Run workflow", zonder invoer) als
# er bij een oplevering een ledkolom klaarstaat. Elke run haalt op wat daar
# klaarstaat en meldt na het publiceren terug wat er gelukt is; zie
# "Vanuit de designaanvraag" in de README.
on:
  workflow_run:
    workflows: ["Release verwerken"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'config.json'
      - '.github/workflows/publiceer-preview.yml'
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Link naar de ledkolom-video (leeglaten als je hem al in docs/p/ hebt gezet)'
        required: false
        default: ''
      naam:
        description: 'Naam op het startscherm, bijvoorbeeld: Deloitte - 25 aug'
        required: false
        default: ''
      foto_preview:
        description: 'Alleen om het moment van de foto op locatie te kiezen: link of naam van de preview'
        required: false
        default: ''
      foto_moment:
        description: 'Seconde in de video voor die foto, bijvoorbeeld 12 of 0:12 (leeg = het script kiest zelf)'
        required: false
        default: ''

permissions:
  contents: write   # om de gegenereerde pagina's terug te committen
  pages: write      # om naar GitHub Pages te publiceren
  id-token: write

# nooit twee builds tegelijk: die zouden elkaars commit overschrijven
concurrency:
  group: kolom-preview
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v4
        with:
          ref: main

      - name: ffmpeg klaarzetten
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Node klaarzetten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # invoer via de omgeving, niet rechtstreeks in het commando: een naam met
      # een aanhalingsteken erin mag geen shell-commando kunnen worden
      - name: Preview(s) bouwen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          VIDEO_URL: ${{ inputs.video_url }}
          NAAM: ${{ inputs.naam }}
          FOTO_PREVIEW: ${{ inputs.foto_preview }}
          FOTO_MOMENT: ${{ inputs.foto_moment }}
          DESIGNAANVRAAG_URL: ${{ vars.DESIGNAANVRAAG_URL }}
          DESIGNAANVRAAG_SECRET: ${{ secrets.DESIGNAANVRAAG_SECRET }}
          AANVRAAG_UITSLAG: ${{ runner.temp }}/aanvragen.json
        run: |
          if [ -n "$FOTO_PREVIEW" ]; then
            node tools/build.mjs moment --preview "$FOTO_PREVIEW" --sec "$FOTO_MOMENT"
          elif [ -n "$VIDEO_URL" ]; then
            if [ -n "$NAAM" ]; then
              node tools/build.mjs add --video "$VIDEO_URL" --name "$NAAM"
            else
              node tools/build.mjs add --video "$VIDEO_URL"
            fi
          else
            node tools/build.mjs scan
          fi

      - name: Resultaat terugzetten in de repository
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs LINKS.md
          if git diff --cached --quiet; then
            echo "Niets veranderd, geen commit nodig."
            exit 0
          fi
          git commit -m "Preview(s) bijgewerkt"
          for poging in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push mislukt, iemand anders was net sneller. Poging $poging."
            git fetch --deepen=50 origin main 2>/dev/null || git fetch origin main
            git rebase origin/main || {
              echo "Rebase lukt niet, handmatig nakijken."
              exit 1
            }
            sleep $((poging * 3))
          done
          echo "Kon het resultaat na 3 pogingen niet pushen."
          exit 1

      - name: Pages configureren
        uses: actions/configure-pages@v5

      - name: Site inpakken
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publiceren naar GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Links op een rij zetten
        env:
          BASIS: ${{ steps.deploy.outputs.page_url }}
        run: |
          node - <<'JS' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const basis = process.env.BASIS || '';
          const dir = 'docs/p';
          const mappen = fs.existsSync(dir)
            ? fs.readdirSync(dir).filter((d) => fs.existsSync(`${dir}/${d}/meta.json`))
            : [];
          console.log('## Previews staan online\n');
          console.log(`Overzicht: ${basis}\n`);
          for (const map of mappen) {
            const m = JSON.parse(fs.readFileSync(`${dir}/${map}/meta.json`, 'utf8'));
            const mb = (m.video.bytes / 1048576).toFixed(1);
            console.log(`- **${m.name}** — ${basis}p/${map}/ (${mb} MB)`);
          }
          JS

      # Altijd, ook als er hierboven iets faalde: wacht er in de designaanvraag
      # een opleveringsmail op een ledkolom, dan moet die horen hoe het ging.
      - name: Designaanvraag laten weten wat er online staat
        if: always()
        env:
          AANVRAAG_UITSLAG: ${{ runner.temp }}/aanvragen.json
          GEPUBLICEERD: ${{ steps.deploy.outcome }}
          DESIGNAANVRAAG_URL: ${{ vars.DESIGNAANVRAAG_URL }}
          DESIGNAANVRAAG_SECRET: ${{ secrets.DESIGNAANVRAAG_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tools/aanvragen-melden.mjs
